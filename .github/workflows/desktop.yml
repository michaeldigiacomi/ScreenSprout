name: Build Desktop

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/desktop

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ScreenSprout.slnx

      - name: Build
        run: dotnet build ScreenSprout.slnx --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ScreenSprout.Watcher/ScreenSprout.Watcher.csproj --configuration Release --self-contained true --runtime win-x64 --output ./publish

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: apps/desktop/publish/**
          retention-days: 30

  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ScreenSprout.slnx
        working-directory: apps/desktop

      - name: Build
        run: dotnet build ScreenSprout.slnx --configuration Release --no-restore
        working-directory: apps/desktop

      - name: Publish
        run: dotnet publish ScreenSprout.Watcher/ScreenSprout.Watcher.csproj --configuration Release --self-contained true --runtime linux-x64 --output ./publish
        working-directory: apps/desktop

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: apps/desktop/publish/**
          retention-days: 30

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ScreenSprout.slnx
        working-directory: apps/desktop

      - name: Run tests
        run: dotnet test ScreenSprout.slnx --no-restore --verbosity normal
        working-directory: apps/desktop