repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: check-merge-conflict

  # For .NET projects, dotnet-format can be used if available
  # Uncomment below if dotnet-format is installed
  # - repo: local
  #   hooks:
  #     - id: dotnet-format
  #       name: dotnet-format
  #       entry: dotnet format --verify-no-changes
  #       language: system
  #       types: ["c#"]
