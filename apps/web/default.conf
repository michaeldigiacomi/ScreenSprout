server {
    listen 80;
    root /usr/share/nginx/html;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://screensprout.digitaladrenalin.net https://app.screensprout.digitaladrenalin.net https://api.screensprout.digitaladrenalin.net wss://app.screensprout.digitaladrenalin.net;" always;

    # Health endpoint - served from static JSON file
    location /api/health {
        try_files /health.json =404;
        add_header Content-Type application/json;
        # Re-add security headers because add_header in location clears inherited ones
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://screensprout.digitaladrenalin.net https://app.screensprout.digitaladrenalin.net https://api.screensprout.digitaladrenalin.net wss://app.screensprout.digitaladrenalin.net;" always;
    }

    # Main app - redirect all paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
