# Ingress for screensprout-web using Traefik
# Routes /api to backend service and all other paths to web frontend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: screensprout-web
  namespace: screensprout
  labels:
    app.kubernetes.io/name: screensprout-web
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: screensprout
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app.screensprout.digitaladrenalin.net
      secretName: screensprout-web-tls
  rules:
    - host: app.screensprout.digitaladrenalin.net
      http:
        paths:
          # API routes go to backend service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: screen-sprout-api
                port:
                  number: 3000
          # All other routes go to web frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
