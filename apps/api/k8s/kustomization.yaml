apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: screensprout

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/name: screen-sprout-api
      app.kubernetes.io/component: backend
      app.kubernetes.io/part-of: screensprout
    includeSelectors: true
    includeTemplates: true

images:
  - name: ghcr.io/screensprout/api
    newTag: latest
