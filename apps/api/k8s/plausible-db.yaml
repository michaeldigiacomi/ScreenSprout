apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plausible-db
  namespace: screensprout
  labels:
    app: plausible-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plausible-db
  serviceName: plausible-db
  template:
    metadata:
      labels:
        app: plausible-db
    spec:
      containers:
      - name: plausible-db
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "plausible"
        - name: POSTGRES_PASSWORD
          value: "plausible"
        - name: POSTGRES_DB
          value: "plausible_db"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "plausible", "-d", "plausible_db"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "plausible", "-d", "plausible_db"]
          initialDelaySeconds: 10
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: plausible-db-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: plausible-db
  namespace: screensprout
  labels:
    app: plausible-db
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: plausible-db
