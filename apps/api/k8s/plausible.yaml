# Plausible Analytics Deployment for ScreenSprout

apiVersion: apps/v1
kind: Deployment
metadata:
  name: plausible
  namespace: screensprout
  labels:
    app: plausible
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plausible
  template:
    metadata:
      labels:
        app: plausible
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.28
        command: ['sh', '-c', "until nc -z -v -w30 plausible-db 5432; do echo waiting for db; sleep 2; done"]
      - name: wait-for-clickhouse
        image: busybox:1.28
        command: ['sh', '-c', "until nc -z -v -w30 plausible-clickhouse 8123; do echo waiting for clickhouse; sleep 2; done"]
      containers:
      - name: plausible
        image: ghcr.io/plausible/community-edition:v3.2.0
        command: ["/bin/sh", "-c"]
        args: ["/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"]
        ports:
        - containerPort: 8000
        env:
        - name: BASE_URL
          value: "https://plausible.digitaladrenalin.net"
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: plausible-secrets
              key: secret-key-base
        - name: DATABASE_URL
          value: "postgres://plausible:plausible@plausible-db:5432/plausible_db"
        - name: CLICKHOUSE_DATABASE_URL
          value: "http://plausible-clickhouse:8123/plausible_events_db"
        - name: DISABLE_REGISTRATION
          value: "true"
        - name: DISABLE_SUBSCRIPTION
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: plausible
  namespace: screensprout
spec:
  selector:
    app: plausible
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plausible
  namespace: screensprout
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - plausible.digitaladrenalin.net
    secretName: plausible-tls
  rules:
  - host: plausible.digitaladrenalin.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: plausible
            port:
              number: 8000
